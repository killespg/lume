<style>
/* Layout: full-bleed painted scene; type sits on it like captions on a print, anchored top-left */
:root{
  --ink:#1b1620;
  --paper:#f6ebdb;
  --paper-dim:rgba(246,235,219,.74);
  --scarf:#c4392a;
  --fly:#e4f59a;
  --gold:#ffd28a;
  --scrim:rgba(13,9,19,.6);
  --display:'Fraunces','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:pointer}
#stage.playing{cursor:none}
#c{display:block;width:100%;height:100%;transition:filter 1.1s ease}
#stage.dim #c{filter:saturate(.62) brightness(.9)}

.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(22px,env(safe-area-inset-right,0px)) 0 max(22px,env(safe-area-inset-left,0px));
  pointer-events:none;opacity:0;transition:opacity .7s ease;text-shadow:0 1px 2px rgba(10,7,16,.35),0 1px 16px rgba(10,7,16,.42)}
.hud.on{opacity:1}
.dist{font-size:clamp(36px,5.2vw,60px);font-weight:380;font-variation-settings:'opsz' 144;line-height:.95;
  font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em}
.dist small,.big small{font-size:.4em;font-style:italic;font-weight:400;margin-left:.12em;letter-spacing:0;opacity:.8}
.flies{margin-top:9px;font-size:15px;display:flex;align-items:center;gap:9px;font-variant-numeric:tabular-nums;color:var(--paper-dim);font-style:italic}
.flies b{font-style:normal;font-weight:500;color:var(--paper)}
.fly-dot{width:7px;height:7px;border-radius:50%;background:var(--fly);box-shadow:0 0 9px 3px rgba(214,246,120,.55)}
.flow{margin-top:5px;font-size:15px;font-style:italic;color:var(--gold);opacity:0;transition:opacity .35s ease;font-variant-numeric:tabular-nums}
.flow.on{opacity:1}
.best{font-size:15px;color:var(--paper-dim);font-style:italic;text-align:right;font-variant-numeric:tabular-nums}

.phase{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 15vh);text-align:center;pointer-events:none;
  font-style:italic;font-weight:300;font-size:clamp(26px,3.4vw,42px);letter-spacing:.01em;opacity:0;
  text-shadow:0 1px 18px rgba(10,7,16,.5)}
.phase.show{animation:phase 3.8s ease forwards}
@keyframes phase{0%{opacity:0;transform:translateY(6px)}18%{opacity:.95;transform:none}70%{opacity:.95}100%{opacity:0}}

.hint{position:fixed;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  max-width:min(30em,calc(100vw - 44px));background:var(--paper);color:var(--ink);padding:9px 14px 10px;font-size:15px;line-height:1.35;
  pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease;box-shadow:0 10px 30px rgba(10,7,16,.18)}
.hint.show{opacity:.96;transform:none}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10vh) max(7vw,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6vh) max(7vw,env(safe-area-inset-left,0px));
  transition:opacity .6s ease}
.screen.fade{opacity:0}
.title{background:linear-gradient(180deg,rgba(14,10,22,.34) 0%,rgba(14,10,22,.16) 42%,rgba(14,10,22,0) 66%)}
.title h1{margin:0;font-size:clamp(88px,15vw,210px);font-style:italic;font-weight:300;line-height:.82;letter-spacing:-.035em;
  font-variation-settings:'opsz' 144;text-shadow:0 2px 30px rgba(20,14,34,.28)}
.lede{margin:22px 0 0;max-width:27ch;font-size:clamp(17px,1.55vw,21px);line-height:1.45;font-weight:350;color:var(--paper);
  text-shadow:0 1px 14px rgba(20,14,34,.4);text-wrap:balance}
.controls{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:26px;font-size:15px;color:var(--paper-dim);text-shadow:0 1px 10px rgba(20,14,34,.4)}
.controls span{display:flex;align-items:baseline;gap:8px}
kbd{font-family:inherit;font-style:italic;font-size:15px;color:var(--paper);border-bottom:1px solid currentColor;padding:0 1px 1px}
.start{margin:30px 0 0;font-size:16px;letter-spacing:.06em;text-transform:lowercase;font-variant:small-caps;color:var(--paper);
  animation:breathe 2.4s ease-in-out infinite;text-shadow:0 1px 12px rgba(20,14,34,.45)}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.record,.keys{margin:10px 0 0;font-size:14px;font-style:italic;color:var(--paper-dim);font-variant-numeric:tabular-nums;text-shadow:0 1px 10px rgba(20,14,34,.4)}

.over,.paused{background:linear-gradient(90deg,var(--scrim) 0%,rgba(13,9,19,.36) 55%,rgba(13,9,19,.1) 100%);padding-top:calc(env(safe-area-inset-top,0px) + 17vh)}
.eyebrow{margin:0;font-size:17px;font-style:italic;color:var(--paper-dim);max-width:28ch}
.eyebrow.newrec{color:var(--gold)}
.big{margin:6px 0 0;font-size:clamp(84px,13vw,180px);font-weight:300;line-height:.9;letter-spacing:-.04em;font-variation-settings:'opsz' 144;font-variant-numeric:tabular-nums lining-nums}
.stats{display:flex;flex-wrap:wrap;gap:14px 34px;margin:26px 0 0;padding:14px 0 0;border-top:1px solid rgba(246,235,219,.28)}
.stats div{display:flex;flex-direction:column;gap:3px}
.stats dt{font-size:13px;font-style:italic;color:var(--paper-dim)}
.stats dd{margin:0;font-size:24px;font-variant-numeric:tabular-nums lining-nums}
.paused .bigword{margin:0;font-size:clamp(64px,10vw,130px);font-style:italic;font-weight:300;letter-spacing:-.03em;line-height:.9}
.menu{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:28px;pointer-events:auto}
.menu button{font:italic 400 clamp(20px,2.2vw,26px) var(--display);color:var(--paper);background:none;border:0;border-bottom:1px solid transparent;padding:4px 2px;cursor:pointer;opacity:.8;transition:opacity .15s,border-color .15s}
.menu button:hover,.menu button:focus-visible{opacity:1;border-bottom-color:currentColor;outline:none}
body.paused .title,body.paused .over,body.paused .hud,body.paused .hint,body.paused .phase{visibility:hidden}

.corner{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:8px;transition:opacity .5s}
.corner.quiet{opacity:.42}
.corner.quiet:hover{opacity:1}
.chip{font:italic 14px var(--display);color:var(--ink);background:var(--paper);border:0;padding:7px 12px 8px;cursor:pointer;opacity:.82;transition:opacity .2s}
.chip:hover{opacity:1}
.chip[aria-pressed="true"]{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1px var(--paper-dim)}
.chip:focus-visible{outline:2px solid var(--paper);outline-offset:3px}

@media (max-width:560px){
  .screen{padding-top:calc(env(safe-area-inset-top,0px) + 7vh)}
  .over,.paused{padding-top:calc(env(safe-area-inset-top,0px) + 13vh)}
  .controls{font-size:14px}
  .hint{font-size:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){.start{animation:none;opacity:.9}}
</style>

<div id="stage"><canvas id="c" aria-label="Lume: cena do jogo"></canvas></div>

<div class="hud" id="hud">
  <div>
    <div class="dist"><span id="dist">0</span><small>m</small></div>
    <div class="flies"><span class="fly-dot"></span><b id="flies">0</b> vaga-lumes</div>
    <div class="flow" id="flow"></div>
  </div>
  <div class="best" id="bestHud"></div>
</div>

<div class="phase" id="phase"></div>
<div class="hint" id="hint" role="status" aria-live="polite"></div>

<section class="screen title" id="title">
  <h1>Lume</h1>
  <p class="lede">Atravesse o vale pendurado nas lanternas. Lá embaixo só existe névoa.</p>
  <div class="controls">
    <span><kbd>segure</kbd> lança a corda</span>
    <span><kbd>solte</kbd> voa</span>
  </div>
  <p class="start">segure espaço, o mouse ou a tela</p>
  <p class="record" id="recTitle"></p>
  <p class="keys" id="keysLine">esc pausa</p>
</section>

<section class="screen over" id="over" hidden>
  <p class="eyebrow" id="oMsg">A névoa te alcançou.</p>
  <p class="big"><span id="oDist">0</span><small>m</small></p>
  <dl class="stats">
    <div><dt>vaga-lumes</dt><dd id="oFlies">0</dd></div>
    <div><dt>melhor sequência</dt><dd id="oStreak">0</dd></div>
    <div><dt>recorde</dt><dd id="oBest">0 m</dd></div>
  </dl>
  <p class="start" id="oAgain">segure para voar de novo</p>
</section>

<section class="screen paused" id="paused" hidden>
  <p class="bigword">Pausa</p>
  <div class="menu">
    <button type="button" id="bResume">continuar</button>
    <button type="button" id="bFull" hidden>tela cheia</button>
    <button type="button" id="bQuit" hidden>sair do jogo</button>
  </div>
</section>

<div class="corner" id="corner">
  <button id="bMusic" class="chip" type="button" aria-pressed="false">música</button>
  <button id="bSfx" class="chip" type="button" aria-pressed="false">som</button>
</div>

const pal = { phase: 0 };

// sun rays: soft wedges fading outward
const RAYS = mkCanvas(512, 512);
{
  const g = RAYS.getContext('2d'); g.translate(256, 256);

{ const g = grain.getContext('2d'), id = g.createImageData(196, 196); for (let i = 0; i < id.data.length; i += 4) { const v = (R() * 255) | 0; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); }

    : short > 0 && short <= 40 ? `Faltaram ${short} m para o recorde.`

    : lap >= 1880 ? 'Você viu a aurora.'
    : lap >= 1080 ? 'Você chegou até a noite.'

  ui.over.hidden = false; ui.over.classList.add('fade'); requestAnimationFrame(() => ui.over.classList.remove('fade'));

}
function restart() {

  reset();

}
function pause() {

  ui.sfx.textContent = Snd.sfxOn ? 'som ligado' : 'som desligado'; ui.sfx.setAttribute('aria-pressed', String(!Snd.sfxOn));
}

/* ---------------------------------------------------------------- input */
function press(id) {
  Snd.init();

}
function release(id) { holds.delete(id); }
const HOLD_KEYS = new Set(['Space', 'ArrowUp', 'KeyW', 'KeyZ', 'KeyX', 'Enter', 'ArrowRight']);
addEventListener('keydown', e => {
  const onButton = e.target && e.target.tagName === 'BUTTON';
  if (onButton && (e.code === 'Space' || e.code === 'Enter')) return;
  if (HOLD_KEYS.has(e.code)) { e.preventDefault(); if (!e.repeat) press('k' + e.code); }
  else if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'paused') resume(); else pause(); }
  else if (e.code === 'KeyM') { Snd.init(); Snd.toggleMusic(); syncChips(); }
  else if (e.code === 'KeyN') { Snd.init(); Snd.toggleSfx(); syncChips(); }
});
addEventListener('keyup', e => { if (HOLD_KEYS.has(e.code)) release('k' + e.code); });

addEventListener('pointercancel', e => release('p' + e.pointerId));
stage.addEventListener('contextmenu', e => e.preventDefault());
ui.paused.addEventListener('pointerdown', e => { if (e.target.tagName !== 'BUTTON') resume(); });
ui.paused.style.pointerEvents = 'auto';
addEventListener('blur', () => { holds.clear(); if (state === 'play') pause(); });

ui.music.addEventListener('click', () => { Snd.init(); Snd.toggleMusic(); syncChips(); ui.music.blur(); });
ui.sfx.addEventListener('click', () => { Snd.init(); Snd.toggleSfx(); syncChips(); ui.sfx.blur(); });
$('#bResume').addEventListener('click', () => { Snd.init(); resume(); });
if (native) {
  const bf = $('#bFull'), bq = $('#bQuit');
  bf.hidden = false; bq.hidden = false;
  bf.addEventListener('click', () => native.toggleFullscreen());
  bq.addEventListener('click', () => native.quit());
  $('#keysLine').textContent = 'esc abre o menu · f11 alterna tela cheia';
}
syncChips();
let padDown = false, padMenu = false;
function pollPad() {
  if (!navigator.getGamepads) return;
  let down = false, menu = false;
  for (const g of navigator.getGamepads()) {
    if (!g) continue;
    const b = g.buttons;
    if ((b[0] && b[0].pressed) || (b[5] && b[5].pressed) || (b[7] && b[7].pressed)) down = true;
    if (b[9] && b[9].pressed) menu = true;
  }
  if (down && !padDown) press('pad'); if (!down && padDown) release('pad'); padDown = down;
  if (menu && !padMenu) { if (state === 'paused') resume(); else pause(); } padMenu = menu;
}

/* ---------------------------------------------------------------- loop */
function resize() {
  // a minimised or hidden window reports zero size; keep a floor so nothing divides by it
  W = Math.max(64, innerWidth || 0); H = Math.max(64, innerHeight || 0);
  DPR = Math.min(devicePixelRatio || 1, 2);
  if (W * H * DPR * DPR > 4.4e6) DPR = Math.max(1, Math.sqrt(4.4e6 / (W * H)));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  buildVignette();
}
addEventListener('resize', resize);
resize();
reset();
palAt(0);
showRecord();
scale = Math.min(H / 1000, W / 950) * 1.1;
cam.x = -(W / scale) * (W < 700 ? .02 : .14); cam.y = -(H / scale) * .36;

const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function tickSim(rdt) {
  timeScale += (tsTarget - timeScale) * (1 - Math.exp(-rdt * 8));
  const dt = rdt * timeScale;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 8) { physicsStep(STEP); acc -= STEP; n++; }
  if (n === 8) acc = 0;

  else if (state === 'over') overT += rdt;
}
function frame(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now;

}
requestAnimationFrame(frame);
if (native && native.autoAudio) Snd.init();
if (/[?&]debug/.test(location.search)) window.__lume = {
  player, holds, press, release, restart, render, fogAt, findTarget, tickSim,
  get state() { return state; }, get m() { return maxX / M; }, set m(v) { maxX = v * M; },
  get flies() { return flyCount; }, get streak() { return bestStreak; }, get anchors() { return anchors; }, get crows() { return crows; },
  get target() { return target; }, get cause() { return cause; }, K: { M, RANGE, PERF_LO, PERF_HI }
};
if (document.fonts && document.fonts.load) document.fonts.load('italic 500 21px Fraunces').catch(() => { });
})();
